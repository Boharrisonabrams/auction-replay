name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact tool versions keep CI results stable. Change them on purpose, in their own PR.
  RUFF_VERSION: "0.17.1"
  MYPY_VERSION: "2.4.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The package has no runtime dependencies, so only the dev tools are installed.
      - name: Install ruff and mypy
        run: python -m pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"

      # Two tests run browser calculation code in Node.js and skip without it.
      # This step fails if the runner has no Node.js, so those tests cannot skip unnoticed.
      - name: Confirm Node.js is available
        run: node --version

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src

      - name: Run unit tests
        run: python -B -m unittest discover -s tests
